name: mirror-sync

# Daily source sync. `main` packages upstream's source under dnsmasq-dhcp/ and
# applies only the WoowTech repository/image overlay.
#
# Upstream's `.github` folder (its CI configuration) is not copied anywhere.
# GitHub does not let this workflow's token push workflow files, so when
# upstream changed its workflow on 2026-10-02 the exact mirror failed every
# night. The `upstream` branch therefore holds upstream's source without
# `.github`, one snapshot commit per change, and is never force-pushed.
# Upstream tags are no longer copied either: they point at upstream commits,
# `.github` included.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Snapshot WoowTech overlay
        run: |
          set -euo pipefail
          mkdir -p /tmp/overlay
          cp -a .github .mirror README.md repository.yaml .gitignore /tmp/overlay/

      - name: Load mirror configuration
        run: |
          set -a
          . .mirror/config.env
          set +a
          echo "UPSTREAM_URL=$UPSTREAM_URL" >> "$GITHUB_ENV"
          echo "UPSTREAM_BRANCH=$UPSTREAM_BRANCH" >> "$GITHUB_ENV"
          echo "ADDON_DIR=$ADDON_DIR" >> "$GITHUB_ENV"
          echo "MIRROR_IMAGE_PREFIX=$MIRROR_IMAGE_PREFIX" >> "$GITHUB_ENV"

      - name: Fetch upstream source and tags
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --prune --force

      - name: Update upstream source snapshot branch
        run: |
          set -euo pipefail
          # Upstream's tree without `.github`, built in a scratch index.
          export GIT_INDEX_FILE="$RUNNER_TEMP/upstream-snapshot.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "upstream/$UPSTREAM_BRANCH"
          git rm -r -q --cached --ignore-unmatch .github
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          parent=$(git rev-parse --verify -q refs/remotes/origin/upstream || true)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "Upstream snapshot unchanged."
            exit 0
          fi
          upstream_commit=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          export GIT_AUTHOR_NAME="WOOWTECH Mirror Bot" GIT_COMMITTER_NAME="WOOWTECH Mirror Bot"
          export GIT_AUTHOR_EMAIL="woowtech-mirror-bot@designsmart.com.tw" GIT_COMMITTER_EMAIL="woowtech-mirror-bot@designsmart.com.tw"
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "[bot] upstream snapshot ${UPSTREAM_URL##*/}@${upstream_commit} without .github")
          # A normal push: the snapshot sits on top of the previous one.
          git push origin "$commit:refs/heads/upstream"

      - name: Rebuild main repository tree
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream-src
          mkdir -p /tmp/upstream-src
          git archive "upstream/$UPSTREAM_BRANCH" | tar -x -C /tmp/upstream-src
          # Upstream's CI configuration is not part of the add-on.
          rm -rf /tmp/upstream-src/.github

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p "$ADDON_DIR"
          cp -a /tmp/upstream-src/. "$ADDON_DIR/"
          cp -a /tmp/overlay/. .

          python3 .mirror/patch-image.py
          {
            echo "last_sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream_url: $UPSTREAM_URL"
            echo "upstream_branch: $UPSTREAM_BRANCH"
            echo "upstream_commit: $(git rev-parse upstream/$UPSTREAM_BRANCH)"
            echo "addon_dir: $ADDON_DIR"
            echo "mirror_image_prefix: $MIRROR_IMAGE_PREFIX"
          } > .mirror/last-sync.yaml

      - name: Commit and push main
        run: |
          set -euo pipefail
          git config user.email "woowtech-mirror-bot@designsmart.com.tw"
          git config user.name "WOOWTECH Mirror Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
          else
            git commit -m "[bot] mirror sync $(date -u +%Y-%m-%d) — ha-addon-dnsmasq-dhcp@${UPSTREAM_BRANCH}"
          fi
          # Concurrency protects workflow runs; a normal push also protects any
          # concurrent human maintenance commit from being discarded.
          git push origin main
