name: mirror-sync

# Daily source sync. `main` packages upstream's source under dnsmasq-dhcp/ and
# applies only the WoowTech repository/image overlay.
#
# Upstream's `.github` folder (its CI configuration) is not copied anywhere.
# GitHub does not let this workflow's token push workflow files, so when
# upstream changed its workflow on 2026-10-02 the exact mirror failed every
# night. The `upstream` branch therefore holds upstream's source without
# `.github`, one snapshot commit per change, and is never force-pushed.
# Upstream tags are no longer copied either: they point at upstream commits,
# `.github` included.
#
# Nothing ships unchecked (pipeline #91). After the sync, in this order, each
# job waiting for the one before it:
#   1. image-mirror copies the image of the pushed commit to GHCR (a failed
#      copy stops the run);
#   2. the Store's upgrade comparison (sha mode) compares the add-on, when its
#      version differs from its latest formal Release, with that Release:
#      categories 1-4, both sides the GHCR image users install;
#   3. the Store's Release workflow creates the Release only if it passed
#      (`components`). A failed comparison fails this run.
# On the schedule, steps 1-3 run only when the sync pushed a new commit.
# workflow_dispatch always runs them, so after adding a declaration a manual
# run checks the same upstream version again.
#
# Overlay files for the upgrade comparison live in .mirror/<add-on dir>/
# (.mirror/dnsmasq-dhcp/): upgrade-check/ (hooks, settings) and
# upgrade-notes.yaml (declared breaking changes, with the migration). The
# rebuild copies them into <add-on dir>/, where the Store tools read them. A
# breaking upstream change that is intended: declare it in
# .mirror/dnsmasq-dhcp/upgrade-notes.yaml, commit, then run this workflow by
# hand; the declaration goes into the Release notes.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Snapshot WoowTech overlay
        run: |
          set -euo pipefail
          mkdir -p /tmp/overlay
          cp -a .github .mirror README.md repository.yaml .gitignore /tmp/overlay/

      - name: Load mirror configuration
        run: |
          set -a
          . .mirror/config.env
          set +a
          echo "UPSTREAM_URL=$UPSTREAM_URL" >> "$GITHUB_ENV"
          echo "UPSTREAM_BRANCH=$UPSTREAM_BRANCH" >> "$GITHUB_ENV"
          echo "ADDON_DIR=$ADDON_DIR" >> "$GITHUB_ENV"
          echo "MIRROR_IMAGE_PREFIX=$MIRROR_IMAGE_PREFIX" >> "$GITHUB_ENV"

      - name: Fetch upstream source and tags
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --prune --force

      - name: Update upstream source snapshot branch
        run: |
          set -euo pipefail
          # Upstream's tree without `.github`, built in a scratch index.
          export GIT_INDEX_FILE="$RUNNER_TEMP/upstream-snapshot.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "upstream/$UPSTREAM_BRANCH"
          git rm -r -q --cached --ignore-unmatch .github
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          parent=$(git rev-parse --verify -q refs/remotes/origin/upstream || true)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "Upstream snapshot unchanged."
            exit 0
          fi
          upstream_commit=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          export GIT_AUTHOR_NAME="WOOWTECH Mirror Bot" GIT_COMMITTER_NAME="WOOWTECH Mirror Bot"
          export GIT_AUTHOR_EMAIL="woowtech-mirror-bot@designsmart.com.tw" GIT_COMMITTER_EMAIL="woowtech-mirror-bot@designsmart.com.tw"
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "[bot] upstream snapshot ${UPSTREAM_URL##*/}@${upstream_commit} without .github")
          # A normal push: the snapshot sits on top of the previous one.
          git push origin "$commit:refs/heads/upstream"

      - name: Rebuild main repository tree
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream-src
          mkdir -p /tmp/upstream-src
          git archive "upstream/$UPSTREAM_BRANCH" | tar -x -C /tmp/upstream-src
          # Upstream's CI configuration is not part of the add-on.
          rm -rf /tmp/upstream-src/.github

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p "$ADDON_DIR"
          cp -a /tmp/upstream-src/. "$ADDON_DIR/"
          cp -a /tmp/overlay/. .
          # Upgrade comparison hooks and declarations (pipeline #91):
          # .mirror/<add-on dir>/{upgrade-check/,upgrade-notes.yaml} -> <add-on dir>/
          for src in .mirror/*/; do
            [ -d "$src" ] || continue
            addon=$(basename "$src")
            if [ ! -d "$addon" ]; then
              echo "::warning::.mirror/$addon/ has no add-on directory $addon/ upstream; not copied"
              continue
            fi
            if [ -d "$src/upgrade-check" ]; then
              rm -rf "$addon/upgrade-check"
              cp -a "$src/upgrade-check" "$addon/upgrade-check"
              echo "Copied .mirror/$addon/upgrade-check/ into $addon/"
            fi
            if [ -f "$src/upgrade-notes.yaml" ]; then
              cp -a "$src/upgrade-notes.yaml" "$addon/upgrade-notes.yaml"
              echo "Copied .mirror/$addon/upgrade-notes.yaml into $addon/"
            fi
          done

          python3 .mirror/patch-image.py
          {
            echo "last_sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream_url: $UPSTREAM_URL"
            echo "upstream_branch: $UPSTREAM_BRANCH"
            echo "upstream_commit: $(git rev-parse upstream/$UPSTREAM_BRANCH)"
            echo "addon_dir: $ADDON_DIR"
            echo "mirror_image_prefix: $MIRROR_IMAGE_PREFIX"
          } > .mirror/last-sync.yaml

      - name: Commit and push main
        id: push
        run: |
          set -euo pipefail
          git config user.email "woowtech-mirror-bot@designsmart.com.tw"
          git config user.name "WOOWTECH Mirror Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            changed=false
          else
            git commit -m "[bot] mirror sync $(date -u +%Y-%m-%d) — ha-addon-dnsmasq-dhcp@${UPSTREAM_BRANCH}"
            changed=true
          fi
          # Concurrency protects workflow runs; a normal push also protects any
          # concurrent human maintenance commit from being discarded.
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # 1. Copy the pushed commit's image to GHCR before anything compares it.
  # Scheduled runs go on only when the sync pushed a commit; a manual run always does.
  image-mirror:
    name: Image copy
    needs: sync
    if: needs.sync.outputs.sha != '' && (needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-mirror.yml
    with:
      sha: ${{ needs.sync.outputs.sha }}

  # 2. Upgrade comparison (sha mode, Store #167): the add-on, when its version is
  # not its latest formal Release's, is compared with that Release. Runs only
  # after a successful image copy. Its output `passed` is the JSON array of the
  # add-ons that passed; a failed add-on fails this job and so the run.
  upgrade-comparison:
    name: Upgrade comparison
    needs: [sync, image-mirror]
    permissions:
      contents: read
      actions: read
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@main
    with:
      sha: ${{ needs.sync.outputs.sha }}

  # 3. The App Store ships only formal Releases (registry ref_policy: release).
  # Release the pushed commit only if the add-on passed (Store #168): it gets its
  # v<version> Release, with its upgrade-notes.yaml declarations in the notes.
  # Never without a list: an empty `components` would release every add-on, so
  # "" (the comparison did not run or gave no output) skips it, and so does []
  # (nothing passed, or no version changed).
  release:
    name: Release
    needs: [sync, image-mirror, upgrade-comparison]
    if: >-
      ${{ !cancelled()
      && needs.sync.result == 'success'
      && needs.image-mirror.result == 'success'
      && (needs.upgrade-comparison.result == 'success' || needs.upgrade-comparison.result == 'failure')
      && needs.upgrade-comparison.outputs.passed != ''
      && needs.upgrade-comparison.outputs.passed != '[]' }}
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
    with:
      sha: ${{ needs.sync.outputs.sha }}
      components: ${{ needs.upgrade-comparison.outputs.passed }}
